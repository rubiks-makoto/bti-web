<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BTI — Beauty Type Indicator</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Noto+Serif+JP:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0c0b;--bg2:#141412;--white:#f8f5ef;--gold:#c4963f;--gold-light:#e0b96a;
  --gray:#7a7670;--gray-light:#a8a49b;--line:rgba(248,245,239,0.1);
  --serif:'Cormorant Garamond',serif;--jp:'Noto Serif JP',serif;--sans:'DM Sans',sans-serif;
}
html,body{height:100%;height:100dvh;height:-webkit-fill-available;overflow:hidden;background:var(--bg);color:var(--white);font-family:var(--sans)}
.screen{position:fixed;top:0;left:0;width:100%;height:100dvh;height:-webkit-fill-available;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity 0.5s ease}
.screen.active{opacity:1;pointer-events:all}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(196,150,63,0.06) 0%,transparent 60%);pointer-events:none;z-index:0}

#landing{justify-content:center;align-items:center;text-align:center;padding:24px 32px;z-index:1;overflow-y:auto}
.landing-tag{font-family:var(--sans);font-size:10px;letter-spacing:0.45em;text-transform:uppercase;color:var(--gold);margin-bottom:32px;display:flex;align-items:center;justify-content:center;gap:12px}
.landing-tag::before,.landing-tag::after{display:none}
.landing-bti{font-family:var(--serif);font-size:clamp(80px,20vw,160px);font-weight:300;line-height:0.9;letter-spacing:-0.03em;color:var(--white);margin-bottom:8px;position:relative}
.landing-bti::after{content:"BTI";position:absolute;top:3px;left:3px;color:var(--gold);opacity:0.12;pointer-events:none}
.landing-en{font-family:var(--sans);font-size:clamp(9px,2vw,13px);letter-spacing:0.5em;text-transform:uppercase;color:var(--gold);margin-bottom:28px;display:block}
.landing-divider{width:48px;height:1px;background:var(--gold);margin:28px auto}
.landing-sub{font-family:var(--jp);font-size:clamp(11px,2.8vw,13px);letter-spacing:0.08em;color:var(--gray-light);margin-bottom:48px;line-height:2}
.landing-stats{display:flex;justify-content:center;border:1px solid var(--line);margin-bottom:48px;max-width:360px;margin-left:auto;margin-right:auto}
.landing-stat{padding:16px 20px;flex:1;border-right:1px solid var(--line);text-align:center}
.landing-stat:last-child{border-right:none}
.landing-stat-label{font-family:var(--sans);font-size:8px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:4px}
.landing-stat-val{font-family:var(--serif);font-size:28px;font-weight:300;color:var(--white);display:block;line-height:1}
.btn-start{display:inline-flex;align-items:center;gap:12px;padding:16px 36px;background:var(--gold);color:#0c0c0b;font-family:var(--sans);font-size:11px;letter-spacing:0.3em;text-transform:uppercase;font-weight:600;border:none;cursor:pointer;transition:all 0.3s}
.btn-start:hover{background:var(--gold-light)}

#quiz{z-index:1;overflow:hidden}
.quiz-progress-wrap{position:absolute;top:0;left:0;right:0;z-index:10;padding:20px 24px 0}
.quiz-progress-bar-bg{height:2px;background:rgba(248,245,239,0.08);position:relative;overflow:hidden}
.quiz-progress-bar-fill{position:absolute;top:0;left:0;height:100%;background:var(--gold);width:0%;transition:width 0.6s cubic-bezier(0.4,0,0.2,1)}
.quiz-progress-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.quiz-progress-count{font-family:var(--serif);font-size:13px;font-style:italic;color:var(--gold)}
.quiz-progress-axis{font-family:var(--sans);font-size:8px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gray)}
.quiz-cards{position:absolute;inset:0;top:80px}
.quiz-card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:24px 28px 120px;opacity:0;transform:translateX(60px);transition:all 0.45s cubic-bezier(0.4,0,0.2,1);pointer-events:none}
.quiz-card.active{opacity:1;transform:translateX(0);pointer-events:all}
.quiz-card.exit{opacity:0;transform:translateX(-60px)}
.quiz-q-num{font-family:var(--serif);font-size:13px;font-style:italic;color:var(--gold);margin-bottom:20px;letter-spacing:0.1em}
.quiz-q-text{font-family:var(--jp);font-size:clamp(17px,4.2vw,22px);font-weight:500;color:var(--white);line-height:1.6;letter-spacing:0.04em;margin-bottom:28px}
.quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-opt{background:transparent;border:1px solid var(--line);color:var(--white);padding:16px 20px;text-align:left;cursor:pointer;font-family:var(--jp);font-size:clamp(13px,3.2vw,15px);line-height:1.5;transition:all 0.25s;display:flex;align-items:center;gap:14px;-webkit-appearance:none;border-radius:0}
.quiz-opt:active{transform:scale(0.98)}
.quiz-opt-letter{font-family:var(--serif);font-size:18px;font-style:italic;color:var(--gold);min-width:18px;flex-shrink:0}
.quiz-opt:hover,.quiz-opt.selected{background:rgba(196,150,63,0.08);border-color:rgba(196,150,63,0.4)}
.quiz-opt.selected{border-color:var(--gold)}
.quiz-bottom{position:absolute;bottom:0;left:0;right:0;padding:20px 28px;background:linear-gradient(transparent,var(--bg) 40%)}
.quiz-back-btn{background:none;border:none;color:var(--gray);font-family:var(--sans);font-size:10px;letter-spacing:0.25em;text-transform:uppercase;cursor:pointer;padding:8px 0}
.quiz-back-btn:disabled{opacity:0.3;cursor:not-allowed}

#loading{justify-content:center;align-items:center;z-index:1;gap:24px}
.loading-spinner{width:64px;height:64px}
.loading-spinner svg{width:100%;height:100%;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:var(--jp);font-size:14px;letter-spacing:0.2em;color:var(--gray-light)}
.loading-code{font-family:var(--serif);font-size:11px;letter-spacing:0.4em;color:var(--gray);text-transform:uppercase}

#result{overflow-y:auto;z-index:1;-webkit-overflow-scrolling:touch}
.result-inner{padding:60px 28px 40px;max-width:600px;margin:0 auto;min-height:100%}
.result-eyebrow{font-family:var(--sans);font-size:9px;letter-spacing:0.45em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:16px}
.result-code{font-family:var(--serif);font-size:clamp(60px,15vw,110px);font-weight:300;line-height:0.9;letter-spacing:-0.02em;color:var(--white);text-align:center;margin-bottom:16px;display:block}
.result-name{font-family:var(--jp);font-size:clamp(17px,4.2vw,22px);font-weight:600;letter-spacing:0.1em;text-align:center;margin-bottom:8px}
.result-catch{font-family:var(--jp);font-size:clamp(12px,3vw,14px);letter-spacing:0.15em;color:var(--gold-light);text-align:center;font-style:italic;margin-bottom:8px}
.result-axes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:32px}
.result-axis{background:var(--bg2);border:1px solid var(--line);padding:14px 16px}
.result-axis-label{font-family:var(--sans);font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gray);margin-bottom:8px;display:block}
.result-axis-val{font-family:var(--serif);font-size:22px;font-weight:300;color:var(--white);margin-bottom:8px;display:block}
.result-axis-bar{height:2px;background:rgba(248,245,239,0.08);position:relative}
.result-axis-bar-fill{position:absolute;top:0;left:0;height:100%;background:var(--gold);width:0%;transition:width 1.2s cubic-bezier(0.4,0,0.2,1)}
.result-desc-wrap{border:1px solid var(--line);padding:24px;margin-bottom:24px}
.result-desc-label{font-family:var(--sans);font-size:8px;letter-spacing:0.35em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:block}
.result-desc{font-family:var(--jp);font-size:13px;line-height:2.1;color:rgba(248,245,239,0.8)}
.result-cta-wrap{border:1px solid rgba(196,150,63,0.3);padding:28px 24px;text-align:center;background:rgba(196,150,63,0.03);margin-bottom:20px}
.result-cta-eyebrow{font-family:var(--sans);font-size:8px;letter-spacing:0.4em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;display:block}
.result-cta-title{font-family:var(--jp);font-size:clamp(15px,3.8vw,18px);font-weight:500;letter-spacing:0.08em;line-height:1.6;margin-bottom:12px}
.result-cta-items{display:flex;flex-direction:column;gap:6px;margin-bottom:24px;text-align:left}
.result-cta-item{font-family:var(--jp);font-size:12px;color:rgba(248,245,239,0.7);display:flex;align-items:center;gap:8px}
.result-cta-item::before{content:"◆";color:var(--gold);font-size:8px;flex-shrink:0}
.btn-line{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:18px 24px;background:#06C755;color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:11px;letter-spacing:0.25em;text-transform:uppercase;font-weight:600;text-decoration:none;transition:all 0.3s}
.btn-line:hover{background:#05b34d;transform:translateY(-1px)}
.btn-line-sub{font-family:var(--jp);font-size:10px;letter-spacing:0.1em;opacity:0.85;display:block;margin-top:3px;font-weight:400}
.result-share{text-align:center;padding-top:20px;border-top:1px solid var(--line)}
.result-share-label{font-family:var(--sans);font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gray);margin-bottom:14px;display:block}
.share-btns{display:flex;justify-content:center;gap:14px}
.share-btn-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.share-btn-ig{width:56px;height:56px;border-radius:14px;border:none;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.2s,opacity 0.2s}
.share-btn-ig:active{transform:scale(0.93);opacity:0.85}
.share-btn-th{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s}
.share-btn-th:active{transform:scale(0.93)}
.share-btn-th:hover{border-color:rgba(248,245,239,0.3)}
.share-btn-text{font-family:var(--jp);font-size:10px;color:rgba(248,245,239,0.45);letter-spacing:0.05em}

@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.result-inner>*{opacity:0;animation:fadeInUp 0.6s ease forwards}
.result-inner>*:nth-child(1){animation-delay:0.1s}.result-inner>*:nth-child(2){animation-delay:0.2s}
.result-inner>*:nth-child(3){animation-delay:0.3s}.result-inner>*:nth-child(4){animation-delay:0.4s}
.result-inner>*:nth-child(5){animation-delay:0.5s}.result-inner>*:nth-child(6){animation-delay:0.6s}
.result-inner>*:nth-child(7){animation-delay:0.7s}.result-inner>*:nth-child(8){animation-delay:0.8s}
@media(max-width:400px){.landing-bti{font-size:72px}.quiz-card{padding:20px 20px 110px}}

@keyframes charDrift{from{transform:translateY(0)}to{transform:translateY(-10px)}}
#landing{position:relative;background:linear-gradient(180deg, #1e1b17 0%, #252118 40%, #1e1b17 100%) !important}
#landing .landing-tag,#landing .landing-bti,#landing .landing-en,
#landing .landing-divider,#landing .landing-sub,#landing .landing-stats,
#landing .btn-start{position:relative;z-index:2}
body::before{background:none !important}

/* IPキャラ共通 */
.char-img{position:absolute;width:auto;opacity:0.85;filter:drop-shadow(0 0 30px rgba(196,150,63,0.12))}
/* 左上: creator_m */
.char-lt{left:0%;top:3%;height:22vh;animation:charDrift 5s ease-in-out 0s infinite alternate}
/* 右上: scale_r */
.char-rt{right:0%;top:3%;height:22vh;animation:charDrift 6s ease-in-out 0.5s infinite alternate}
/* 左中段: crafter_r */
.char-lm{left:0%;top:38%;height:20vh;animation:charDrift 6s ease-in-out 1s infinite alternate}
/* 右中段: top_m */
.char-rm{right:3%;top:42%;height:18vh;animation:charDrift 5s ease-in-out 1.5s infinite alternate}
/* 左下: contract_m */
.char-lb{left:0%;bottom:5%;height:26vh;animation:charDrift 4s ease-in-out 2s infinite alternate}
/* 左下寄り: freelance_m */
.char-lb2{left:18%;bottom:0%;height:20vh;animation:charDrift 5s ease-in-out 3s infinite alternate}
/* 右下上: solo_r */
.char-rb1{right:0%;bottom:22%;height:22vh;animation:charDrift 5s ease-in-out 2.5s infinite alternate}
/* 右下: star_r */
.char-rb2{right:0%;bottom:0%;height:24vh;animation:charDrift 4s ease-in-out 3.5s infinite alternate}

/* スマホ 768px以下 */
@media(max-width:768px){
  .char-lt{left:-3%;top:1%;height:17vh}
  .char-rt{right:-3%;top:1%;height:17vh}
  .char-lm{left:-4%;top:36%;height:15vh}
  .char-rm{right:-2%;top:40%;height:14vh}
  .char-lb{left:-2%;bottom:3%;height:23vh}
  .char-lb2{left:14%;bottom:0%;height:16vh}
  .char-rb1{right:0%;bottom:20%;height:19vh}
  .char-rb2{right:-2%;bottom:0%;height:21vh}
}
@media(max-width:400px){
  .char-lt{left:-5%;top:0%;height:15vh}
  .char-rt{right:-5%;top:0%;height:15vh}
  .char-lm{left:-6%;top:38%;height:13vh}
  .char-rm{right:-4%;top:42%;height:12vh}
  .char-lb{left:-3%;bottom:2%;height:21vh}
  .char-lb2{left:12%;bottom:0%;height:14vh}
  .char-rb1{right:-1%;bottom:18%;height:17vh}
  .char-rb2{right:-4%;bottom:0%;height:19vh}
}

/* 結果ページIPキャラ - 1体中央ドカン */
.result-ip-hero{display:flex;justify-content:center;padding:0 0 4px;position:relative;margin-top:-8px}
.result-ip-hero::before{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:80%;height:120px;background:radial-gradient(ellipse,rgba(196,150,63,0.06) 0%,transparent 70%);pointer-events:none}
.result-ip-hero img{width:min(96vw,560px);height:auto;display:block;filter:drop-shadow(0 8px 32px rgba(0,0,0,0.5));position:relative;z-index:1}
#result .result-inner{position:relative;z-index:2}
</style>
</head>
<body>

<div class="screen active" id="landing"><div class="char-container" style="position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden">
  <!-- 左上: creator_m -->
  <img src="/images/creator_m.png" class="char-img char-lt" alt="" loading="lazy">
  <!-- 右上: scale_r -->
  <img src="/images/scale_r.png" class="char-img char-rt" alt="" loading="lazy">
  <!-- 左中段: crafter_r -->
  <img src="/images/crafter_r.png" class="char-img char-lm" alt="" loading="lazy">
  <!-- 右中段: top_m（NEW） -->
  <img src="/images/top_m.png" class="char-img char-rm" alt="" loading="lazy">
  <!-- 左下: contract_m -->
  <img src="/images/contract_m.png" class="char-img char-lb" alt="" loading="lazy">
  <!-- 左下寄り: freelance_m（NEW） -->
  <img src="/images/freelance_m.png" class="char-img char-lb2" alt="" loading="lazy">
  <!-- 右下上: solo_r -->
  <img src="/images/solo_r.png" class="char-img char-rb1" alt="" loading="lazy">
  <!-- 右下: star_r -->
  <img src="/images/star_r.png" class="char-img char-rb2" alt="" loading="lazy">
</div>

  <div class="landing-tag">Stylist Personality Diagnostic</div>
  <div class="landing-bti">BTI</div>
  <span class="landing-en">Beauty Type Indicator</span>
  <div class="landing-divider"></div>
  <div class="landing-jp" style="font-size:clamp(22px,5.5vw,30px);color:var(--white);font-weight:500;letter-spacing:0.15em;margin-bottom:4px">
    <span style="color:var(--gold-light);font-size:clamp(30px,7.5vw,42px);font-weight:600">美容師</span><span style="font-size:clamp(20px,5vw,28px)">のための診断。</span>
  </div>
  <div style="font-family:var(--jp);margin-bottom:8px;position:relative;z-index:2">
    <span style="font-family:var(--serif);font-size:clamp(56px,14vw,88px);font-weight:300;color:var(--gold);line-height:1">16</span><span style="font-family:var(--jp);font-size:clamp(18px,4.5vw,26px);font-weight:500;color:var(--white);letter-spacing:0.1em;margin-left:8px"> タイプ診断</span>
  </div>
  <div class="landing-sub">30の質問から、あなたの<br>「美容師としての素顔」を解き明かす。</div>
  <div class="landing-stats">
    <div class="landing-stat">
      <span class="landing-stat-label">Questions</span>
      <span class="landing-stat-val">30</span>
    </div>
    <div class="landing-stat">
      <span class="landing-stat-label">Types</span>
      <span class="landing-stat-val">16</span>
    </div>
    <div class="landing-stat">
      <span class="landing-stat-label">所要時間</span>
      <span class="landing-stat-val" style="font-family:var(--jp);white-space:nowrap;color:var(--gold-light)"><span style="font-size:14px">約</span><span style="font-size:28px">3</span><span style="font-size:14px">分</span></span>
    </div>
  </div>
  <button class="btn-start" onclick="startQuiz()">診断をはじめる →</button>
</div>

<div class="screen" id="quiz">
  <div class="quiz-progress-wrap">
    <div class="quiz-progress-meta">
      <span class="quiz-progress-count" id="qCount">1 / 30</span>
      <span class="quiz-progress-axis" id="qAxis"></span>
    </div>
    <div class="quiz-progress-bar-bg"><div class="quiz-progress-bar-fill" id="qFill"></div></div>
  </div>
  <div class="quiz-cards" id="quizCards"></div>
  <div class="quiz-bottom">
    <button class="quiz-back-btn" id="backBtn" onclick="goBack()" disabled>← 前の質問</button>
  </div>
</div>

<div class="screen" id="loading">
  <div class="loading-code" id="loadingCode">ANALYZING</div>
  <div class="loading-spinner">
    <svg viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="28" stroke="rgba(196,150,63,0.2)" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="28" stroke="#c4963f" stroke-width="1.5" stroke-dasharray="44 132" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="loading-text" id="loadingText">16タイプから、あなたの型を照合中...</div>
</div>

<div class="screen" id="result">
  <div class="result-inner" id="resultInner"></div>
</div>

<script>
// ===== 30問 =====
const Q = [
  // Axis 01
  {axis:'Axis 01 / Player ⇔ Builder',q:'月末、売上目標に届かなかった。最初にとった行動は？',opts:['自分の技術や接客を見直して次月に備えた','集客の導線や仕組みを洗い直した','営業日を増やすか稼働を上げた','正直、そこまで深く考えなかった'],sc:['P','B','P','N']},
  {axis:'Axis 01 / Player ⇔ Builder',q:'1,000万円が手に入ったら、まず何に使う？',opts:['高級車・ブランド品・時計など自分へのご褒美','自分の店・ブランドの開業や拡大資金','投資・貯金して将来に備える','スタッフや環境への投資に使う'],sc:['P','B','B','B']},
  {axis:'Axis 01 / Player ⇔ Builder',q:'尊敬する人物に近いのは？',opts:['指名売上トップクラスのカリスマ美容師','組織を作って業界を変えた経営者','独立して成功した経営者','技術と人望で地域に愛されるスタイリスト'],sc:['P','B','OWNER','P']},
  {axis:'Axis 01 / Player ⇔ Builder',q:'スタッフが辞めると言い出した時、最初に頭に浮かんだのは？',opts:['技術や教育面で不安があったのかな','評価制度や待遇に問題があったのかも','人間関係で何かあったのかな','自分に何かできることはあったか'],sc:['P','B','N','H']},
  {axis:'Axis 01 / Player ⇔ Builder',q:'仕事終わりに考えてること、近いのは？',opts:['明日の指名客のスタイルやお客様のことを考えてる','売上や集客の数字・改善策を考えてる','スタッフのことや人間関係を考えてる','特に何も考えずオフにしてる'],sc:['P','B','H','St']},

        ${q.opts.map((opt, j) => `
          <button class="quiz-opt" onclick="selectAnswer(${i}, ${j})">
            <span class="quiz-opt-letter">${['A','B','C','D'][j]}.</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    `;
    container.appendChild(card);
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  position = null; salonWork = null; age = null; gender = null; questionsArr = [];
  showScreen('quiz');
  showPositionScreen();
}

function selectAnswer(qIdx, optIdx) {
  if (qIdx !== current) return;
  const q = questionsArr[qIdx];
  const sc = q.sc[optIdx];
  const opts = document.querySelectorAll(`#card-${qIdx} .quiz-opt`);
  opts[optIdx].classList.add('selected');
  answers[qIdx] = optIdx;
  if (scores[sc] !== undefined) scores[sc]++;
  setTimeout(() => {
    current++;
    if (current >= questionsArr.length) {
      finishQuiz();
    } else {
      const prevCard = document.getElementById('card-' + (current-1));
      const nextCard = document.getElementById('card-' + current);
      prevCard.classList.remove('active');
      prevCard.classList.add('exit');
      setTimeout(() => prevCard.classList.remove('exit'), 450);
      nextCard.classList.add('active');
      updateProgress();
    }
  }, 280);
}

function goBack() {
  if (current <= 0) return;
  const prevQ = questionsArr[current-1];
  const prevAns = answers[current-1];
  if (prevAns !== undefined) {
    const sc = prevQ.sc[prevAns];
    if (scores[sc] !== undefined && scores[sc] > 0) scores[sc]--;
    answers.pop();
  }
  const curCard = document.getElementById('card-' + current);
  const prevCard = document.getElementById('card-' + (current-1));
  curCard.classList.remove('active');
  prevCard.classList.remove('exit');
  prevCard.classList.add('active');
  prevCard.querySelectorAll('.quiz-opt').forEach(o => o.classList.remove('selected'));
  current--;
  updateProgress();
}

function updateProgress() {
  document.getElementById('qCount').textContent = `${current+1} / ${questionsArr.length}`;
  document.getElementById('qAxis').textContent = questionsArr[current]?.axis || '';
  document.getElementById('qFill').style.width = ((current+1)/questionsArr.length*100) + '%';
  document.getElementById('backBtn').disabled = current === 0;
}

function finishQuiz() {
  showScreen('loading');
  const msgs = ['16タイプから、あなたの型を照合中...','4つの判定軸を分析中...','パーソナリティを解析中...','診断結果を生成中...'];
  let mi = 0;
  const codes = ['ANALYZING ·','ANALYZING ··','ANALYZING ···','PROCESSING'];
  const iv = setInterval(() => {
    mi++;
    document.getElementById('loadingText').textContent = msgs[mi % msgs.length];
    document.getElementById('loadingCode').textContent = codes[mi % codes.length];
  }, 700);
  setTimeout(() => { clearInterval(iv); showResult(); }, 3000);
}

// ===== 判定ロジック =====
function determineType() {
  // ===== 補助フラグ（参考値、強い縛りには使わない） =====
  const isBuilder = scores.B > scores.P;
  const isPlayer  = scores.P >= scores.B;
  const isCrew    = scores.C > scores.S;
  const isSolo    = scores.S >= scores.C;
  const isScale   = scores.Sc > scores.St;
  const isStable  = scores.St >= scores.Sc;
  const isHeart   = scores.H >= scores.L;
  const isLogic   = scores.L > scores.H;
  const isFree    = scores.FREE > scores.STAY;
  const isMove    = scores.MOVE > 0;
  const wantsOwner= scores.OWNER >= 1;
  const isCreate  = scores.CREATE > scores.CRAFT;
  const isCraft   = scores.CRAFT >= scores.CREATE;
  const isEdu     = scores.EDU >= 1;

  // 売上レベル(年齢補正あり)
  let salesLv = scores.S4>=1 ? 4 : scores.S3>=1 ? 3 : scores.S2>=1 ? 2 : 1;
  if (age === 'A') salesLv = Math.min(4, salesLv + 1);
  if (age === 'D' || age === 'E') salesLv = Math.max(1, salesLv - 1);

  const isYoung   = age === 'A' || age === 'B';   // 30歳以下
  const isMidAge  = age === 'C' || age === 'D';   // 31-40
  const isOlder   = age === 'D' || age === 'E';   // 36以上
  const swHeavy   = salonWork === 'A' || salonWork === 'B';
  const swLight   = salonWork === 'C' || salonWork === 'D';
  const isFemale  = gender === 'B';

  // ===== 全16タイプにスコアを付ける =====
  const t = {SOLO:0,MICRO:0,MULTI:0,SCALE:0,FC:0,NO2:0,EXEC:0,MANAGER:0,
             STAR:0,TOP:0,CONTRACT:0,FREELANCE:0,EDU:0,MENTOR:0,CREATOR:0,CRAFTER:0};

  // ----- プレイヤー系 -----
  // STAR
  t.STAR += salesLv * 3;
  if (isCreate) t.STAR += 5;
  if (isScale) t.STAR += 4;
  if (isYoung) t.STAR += 4;
  if (isPlayer) t.STAR += 3;
  if (scores.S4 >= 1) t.STAR += 10;
  if (scores.S3 >= 1) t.STAR += 5;
  if (isFree) t.STAR += 2;
  if (isSolo) t.STAR += 2;
  if (isYoung && scores.CREATE >= 3) t.STAR += 6;

  // TOP
  t.TOP += salesLv * 2;
  if (scores.S3 >= 1) t.TOP += 10;
  if (scores.S4 >= 1) t.TOP += 6;
  if (scores.S2 >= 1) t.TOP += 5;
  if (isCrew) t.TOP += 6;
  if (isStable) t.TOP += 6;
  if (isPlayer) t.TOP += 4;
  if (isHeart) t.TOP += 3;
  if (isYoung && isCrew && isStable) t.TOP += 5;
  if (scores.CRAFT >= 2 && scores.S2 >= 1) t.TOP += 3;

  // CONTRACT (デフォルト枠・特徴薄い人向け)
  t.CONTRACT += 4;                         // ベース更に控えめ
  if (scores.S2 >= 1) t.CONTRACT += 6;
  if (scores.S1 >= 1) t.CONTRACT += 5;
  if (scores.S3 >= 1) t.CONTRACT += 2;
  if (isSolo) t.CONTRACT += 3;
  if (isStable) t.CONTRACT += 3;
  if (isFree) t.CONTRACT += 4;
  if (isPlayer) t.CONTRACT += 3;
  if (isYoung) t.CONTRACT += 3;
  if (isMove) t.CONTRACT += 3;
  if (!wantsOwner) t.CONTRACT += 2;
  // 「特徴が薄い」人にボーナス（どの軸も突出してない）
  const maxAxis = Math.max(scores.CRAFT, scores.CREATE, scores.HEART, scores.EDU, scores.OWNER, scores.N);
  if (maxAxis <= 2) t.CONTRACT += 5;

  // FREELANCE (強化)
  t.FREELANCE += 4;
  if (scores.S3 >= 1) t.FREELANCE += 10;
  if (scores.S4 >= 1) t.FREELANCE += 12;
  if (scores.S2 >= 1) t.FREELANCE += 4;
  if (isFree) t.FREELANCE += 10;
  if (isSolo) t.FREELANCE += 6;
  if (isStable) t.FREELANCE += 2;
  if (wantsOwner) t.FREELANCE += 5;
  if (isPlayer) t.FREELANCE += 4;
  if (scores.FREE >= 2) t.FREELANCE += 4;
  if (scores.FREE >= 3) t.FREELANCE += 6;
  if (isYoung && isFree) t.FREELANCE += 4;

  // ----- 育成・専門系 -----
  // EDU (EDU軸明確な人を確実に拾う)
  t.EDU += scores.EDU * 8;                 // EDU軸への加点を強める
  if (isEdu) t.EDU += 5;
  if (isLogic && isEdu) t.EDU += 4;
  if (isCrew && isEdu) t.EDU += 4;
  if (isMidAge) t.EDU += 3;
  if (scores.S2 >= 1 && isEdu) t.EDU += 3;
  if (scores.S3 >= 1 && isEdu) t.EDU += 3;
  if (isPlayer && isEdu) t.EDU += 3;
  if (!wantsOwner && isEdu) t.EDU += 3;

  // MENTOR (HEART軸明確な人を拾う・強化)
  t.MENTOR += scores.HEART * 4;            // 倍率3→4
  if (isHeart && scores.HEART >= 2) t.MENTOR += 6;
  if (isHeart && scores.H >= 4) t.MENTOR += 6;
  if (isCrew && isHeart) t.MENTOR += 6;
  if ((isMidAge || isOlder) && isHeart) t.MENTOR += 5;
  if (scores.HEART >= 3 && isCrew) t.MENTOR += 6;
  if (scores.HEART >= 4) t.MENTOR += 5;
  if (isPlayer && isCrew && isHeart) t.MENTOR += 4;

  // CREATOR (CREATE軸明確な人を拾う)
  t.CREATOR += scores.CREATE * 4;
  if (isCreate && scores.CREATE >= 2) t.CREATOR += 5;
  if (isCreate && isSolo) t.CREATOR += 5;
  if (isFree && isCreate) t.CREATOR += 3;
  if (isPlayer && isCreate) t.CREATOR += 3;
  if (scores.CREATE >= 3) t.CREATOR += 6;
  if (scores.CREATE >= 4) t.CREATOR += 4;
  if (isYoung && isCreate) t.CREATOR += 2;

  // CRAFTER (CRAFT軸明確な人を拾う)
  t.CRAFTER += scores.CRAFT * 4;
  if (isCraft && scores.CRAFT >= 2) t.CRAFTER += 5;
  if (isCraft && isSolo) t.CRAFTER += 5;
  if (isCraft && isStable) t.CRAFTER += 4;
  if (isLogic && isCraft) t.CRAFTER += 4;
  if (scores.CRAFT >= 3) t.CRAFTER += 6;
  if (scores.CRAFT >= 4) t.CRAFTER += 4;
  if (!wantsOwner && isCraft) t.CRAFTER += 2;
  if (isPlayer && isCraft) t.CRAFTER += 2;

  // ----- 組織系 -----
  // MANAGER
  t.MANAGER += 3;
  if (isCrew) t.MANAGER += 5;
  if (isBuilder) t.MANAGER += 4;
  if (isHeart) t.MANAGER += 4;
  if (position === 'C') t.MANAGER += 8;
  if (position === 'B') t.MANAGER += 2;
  if (scores.HEART >= 2) t.MANAGER += 3;
  if (isMidAge) t.MANAGER += 2;
  if (isCrew && isBuilder && isHeart) t.MANAGER += 4;

  // NO2
  t.NO2 += 2;
  if (isLogic) t.NO2 += 5;
  if (isCrew) t.NO2 += 5;
  if (isBuilder) t.NO2 += 4;
  if (position === 'D') t.NO2 += 8;
  if (position === 'C') t.NO2 += 3;
  if (scores.N >= 1) t.NO2 += 6;
  if (scores.N >= 2) t.NO2 += 4;
  if (!wantsOwner) t.NO2 += 2;

  // EXEC
  t.EXEC += 2;
  if (isBuilder) t.EXEC += 6;
  if (isScale) t.EXEC += 5;
  if (isCrew) t.EXEC += 4;
  if (position === 'D') t.EXEC += 8;
  if (position === 'E') t.EXEC += 3;
  if (swLight) t.EXEC += 3;
  if (wantsOwner) t.EXEC += 2;

  // FC
  t.FC += 2;
  if (wantsOwner) t.FC += 6;
  if (isBuilder) t.FC += 5;
  if (isStable) t.FC += 5;
  if (position === 'E') t.FC += 8;
  if (position === 'D' && wantsOwner) t.FC += 5;
  if (scores.OWNER >= 2) t.FC += 6;
  if (wantsOwner && isStable && !isScale) t.FC += 4;

  // ----- オーナー系 -----
  // SOLO
  if (wantsOwner) t.SOLO += 4;
  if (isSolo) t.SOLO += 5;
  if (isCraft) t.SOLO += 4;
  if (isStable) t.SOLO += 4;
  if (position === 'E') t.SOLO += 8;
  if (!isScale) t.SOLO += 2;
  if (!isBuilder) t.SOLO += 2;

  // MICRO
  if (wantsOwner) t.MICRO += 6;
  if (isPlayer) t.MICRO += 4;
  if (isBuilder) t.MICRO += 4;
  if (position === 'E') t.MICRO += 8;
  if (position === 'C' && wantsOwner) t.MICRO += 5;
  if (!isScale) t.MICRO += 3;
  if (scores.OWNER >= 1 && !isScale) t.MICRO += 4;
  if (scores.OWNER >= 2) t.MICRO += 3;

  // MULTI
  if (wantsOwner) t.MULTI += 6;
  if (isScale) t.MULTI += 6;
  if (isBuilder) t.MULTI += 5;
  if (position === 'E') t.MULTI += 7;
  if (scores.OWNER >= 2 && scores.Sc >= 2) t.MULTI += 6;
  if (wantsOwner && isScale && isBuilder) t.MULTI += 6;
  if (scores.OWNER >= 2 && isScale) t.MULTI += 4;

  // SCALE
  if (scores.OWNER >= 2) t.SCALE += 6;
  if (scores.Sc >= 3) t.SCALE += 5;
  if (isScale && isBuilder && isCrew) t.SCALE += 8;
  if (position === 'E') t.SCALE += 7;
  if (scores.OWNER >= 3) t.SCALE += 6;
  if (scores.Sc >= 4 && wantsOwner) t.SCALE += 4;

  // ===== 動的重み調整 =====
  // CONTRACT底上げ
  t.CONTRACT *= 1.15;
  // MANAGER底上げ
  t.MANAGER *= 1.15;

  // 女性 → オーナー系↓、プレイヤー/育成系↑
  if (isFemale) {
    t.SOLO *= 0.7; t.MICRO *= 0.7; t.MULTI *= 0.7; t.SCALE *= 0.7; t.FC *= 0.8;
    t.STAR *= 1.1; t.TOP *= 1.1; t.CONTRACT *= 1.1; t.FREELANCE *= 1.1;
    t.EDU *= 1.15; t.MENTOR *= 1.15; t.CREATOR *= 1.1; t.CRAFTER *= 1.05;
  }

  // 現役オーナー(E) → オーナー系メイン、たまに別タイプ
  if (position === 'E') {
    t.SOLO *= 1.5; t.MICRO *= 1.5; t.MULTI *= 1.4; t.SCALE *= 1.5; t.FC *= 1.3;
    // 他は0.7倍（たまに出る）
    t.STAR *= 0.7; t.TOP *= 0.7; t.CONTRACT *= 0.7; t.FREELANCE *= 0.8;
    t.EDU *= 0.7; t.MENTOR *= 0.7; t.CREATOR *= 0.7; t.CRAFTER *= 0.7;
    t.NO2 *= 0.7; t.EXEC *= 0.9; t.MANAGER *= 0.7;
  }

  // 幹部(D) → 組織系・オーナー系メイン
  if (position === 'D') {
    t.EXEC *= 1.3; t.NO2 *= 1.3; t.FC *= 1.2;
    t.MULTI *= 1.2; t.MICRO *= 1.1;
    t.STAR *= 0.8; t.CONTRACT *= 0.8; t.FREELANCE *= 0.9;
    t.CRAFTER *= 0.8; t.CREATOR *= 0.8;
  }

  // アシスタント(A)/若手 → STAR/TOP/CREATOR候補に重み
  if (position === 'A' || (position === 'B' && age === 'A')) {
    t.SOLO *= 0.6; t.MICRO *= 0.7; t.MULTI *= 0.6; t.SCALE *= 0.6; t.FC *= 0.7;
    t.EXEC *= 0.7; t.NO2 *= 0.8;
  }

  // 最高得点のタイプを返す
  let bestKey = 'CONTRACT', bestVal = -1;
  for (const k in t) {
    if (t[k] > bestVal) { bestVal = t[k]; bestKey = k; }
  }
  return bestKey;
}

      <div style="color:var(--gold);font-size:9px;letter-spacing:0.3em;text-transform:uppercase;margin-bottom:8px">Debug</div>
      P:${scores.P} B:${scores.B} | S:${scores.S} C:${scores.C} | Sc:${scores.Sc} St:${scores.St} | H:${scores.H} L:${scores.L}<br>
      FREE:${scores.FREE} STAY:${scores.STAY} OWNER:${scores.OWNER} | S4:${scores.S4} S3:${scores.S3} S2:${scores.S2} S1:${scores.S1}<br>
      CRAFT:${scores.CRAFT} CREATE:${scores.CREATE} EDU:${scores.EDU} | pos:${position} sw:${salonWork} age:${age} g:${gender}
    </div>
  `;
  showScreen('result');
  addResultCharacters(key);
  // パターン番号を算出
  window._btiResult = { type: key, pattern: 1 }; // デフォルト
  
  if (scores.S1 > 0 || (scores.S2 === 0 && scores.S3 === 0 && scores.S4 === 0)) {
    window._btiResult.pattern = 1; // 危険水域
  } else if (scores.S2 > 0 && scores.H >= scores.L) {
    window._btiResult.pattern = 2; // 隠れHEART
  } else if (scores.S2 > 0) {
    window._btiResult.pattern = 3; // 純粋型
  } else if (scores.S3 > 0 || scores.S4 > 0) {
    if (scores.CREATE > 0 || scores.CRAFT > 0) {
      window._btiResult.pattern = 4;
    } else if (scores.EDU > 0) {
      window._btiResult.pattern = 5;
    } else if (scores.OWNER > 0) {
      window._btiResult.pattern = 4;
    } else if (scores.FREE > 0) {
      window._btiResult.pattern = 5;
    } else {
      window._btiResult.pattern = 4; // デフォルト上位
    }
  }
  console.log('BTI Result:', window._btiResult);
  setTimeout(() => {
    document.querySelectorAll('.result-axis-bar-fill').forEach(el => { el.style.width = el.style.width; });
  }, 100);
}

function shareStory(key, name, catchText) {
  var imgName = TYPE_TO_IMG[key] || 'solo';
  var suffix = gender === 'B' ? '_r' : '_m';
  var imgSrc = '/images/' + imgName + suffix + '.png';
  
  // Canvas生成
  var W = 1080, H = 1920;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var cx = cv.getContext('2d');
  
  // 背景グラデーション
  var bg = cx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0e08');bg.addColorStop(0.35,'#0d0705');
  bg.addColorStop(0.7,'#080404');bg.addColorStop(1,'#050202');
  cx.fillStyle = bg; cx.fillRect(0,0,W,H);
  
  // ノイズ
  var nc = document.createElement('canvas'); nc.width=W; nc.height=H;
  var nx = nc.getContext('2d');
  var nd = nx.createImageData(W,H);
  for(var i=0;i<nd.data.length;i+=4){var v=Math.random()*10;nd.data[i]=v;nd.data[i+1]=v;nd.data[i+2]=v;nd.data[i+3]=6;}
  nx.putImageData(nd,0,0); cx.drawImage(nc,0,0);
  
  // キャラ読み込み→描画→テキスト→シェア
  var charImg = new Image();
  charImg.crossOrigin = 'anonymous';
  charImg.onload = function(){
    drawStory(cx,W,H,charImg,key,name,catchText);
    doShare(cv, key);
  };
  charImg.onerror = function(){
    drawStory(cx,W,H,null,key,name,catchText);
    doShare(cv, key);
  };
  charImg.src = imgSrc;
}

function drawStory(cx,W,H,charImg,key,name,catchText){
  // キャラ描画
  if(charImg){
    var cH = H * 0.52;
    var cW = cH * (charImg.width / charImg.height);
    cx.globalAlpha = 0.92;
    cx.drawImage(charImg, (W-cW)/2, H-cH-180, cW, cH);
    cx.globalAlpha = 1;
  }
  // 上部オーバーレイ
  var to = cx.createLinearGradient(0,0,0,H*0.45);
  to.addColorStop(0,'rgba(10,5,3,0.9)');to.addColorStop(1,'rgba(10,5,3,0)');
  cx.fillStyle = to; cx.fillRect(0,0,W,H*0.45);
  // 下部オーバーレイ
  var bo = cx.createLinearGradient(0,H*0.75,0,H);
  bo.addColorStop(0,'rgba(5,2,2,0)');bo.addColorStop(1,'rgba(5,2,2,0.95)');
  cx.fillStyle = bo; cx.fillRect(0,H*0.75,W,H*0.25);
  
  cx.textAlign = 'center';
  // ブランドロゴ
  cx.fillStyle = 'rgba(196,150,63,0.6)';
  cx.font = '400 28px Georgia,serif';
  cx.fillText('YOUR TYPE \u2014 BTI RESULT', W/2, 140);
  // ライン
  cx.strokeStyle = 'rgba(196,150,63,0.25)'; cx.lineWidth = 1;
  cx.beginPath(); cx.moveTo(W/2-160,165); cx.lineTo(W/2+160,165); cx.stroke();
  // タイプコード
  cx.fillStyle = '#ffffff';
  cx.font = '300 180px Georgia,serif';
  cx.fillText(key, W/2, 370);
  // タイプ名
  cx.fillStyle = '#ffffff';
  cx.font = '600 42px sans-serif';
  cx.fillText(name, W/2, 450);
  // キャッチ
  cx.fillStyle = 'rgba(224,185,106,0.75)';
  cx.font = 'italic 28px Georgia,serif';
  cx.fillText('\u2014 ' + catchText + ' \u2014', W/2, 510);
  // ハッシュタグ
  cx.fillStyle = 'rgba(255,255,255,0.4)';
  cx.font = '400 26px sans-serif';
  cx.fillText('#BTI\u8a3a\u65ad  #\u308f\u305f\u3057\u306e\u7f8e\u5bb9\u5e2b\u30bf\u30a4\u30d7', W/2, H-120);
  // URL
  cx.fillStyle = 'rgba(196,150,63,0.4)';
  cx.font = '400 22px sans-serif';
  cx.fillText('bti-web.vercel.app', W/2, H-70);
}

function doShare(cv, key) {
  cv.toBlob(function(blob){
    if(!blob) return;
    var file = new File([blob], 'BTI_'+key+'_story.png', {type:'image/png'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({
        files: [file],
        title: 'BTI\u8a3a\u65ad\u7d50\u679c',
        text: '#BTI\u8a3a\u65ad #\u308f\u305f\u3057\u306e\u7f8e\u5bb9\u5e2b\u30bf\u30a4\u30d7'
      }).catch(function(){});
    } else {
      // PC等フォールバック：ダウンロード
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'BTI_'+key+'_story.png';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url)},5000);
    }
  },'image/png');
}

function shareThreads(key, name) {
  var text = 'BTI\u8a3a\u65ad\u7d50\u679c\uff1a\u3010' + name + '\u3011\n\n#BTI\u8a3a\u65ad #\u308f\u305f\u3057\u306e\u7f8e\u5bb9\u5e2b\u30bf\u30a4\u30d7\nhttps://bti-web.vercel.app';
  window.open('https://www.threads.net/intent/post?text=' + encodeURIComponent(text), '_blank');
}
// LIFF連携
// LINE追加用（既存・友だち追加→診断結果送信）
const BTI_LIFF_ID_FOLLOW = '2010016684-jUp9eANQ';
// シェア機能用（リッチメニューから呼び出し）
const BTI_LIFF_ID_SHARE = '2010016684-yl4wiUZV';

function openLiff() {
  if (!window._btiResult) {
    alert('診断結果がありません。もう一度診断してください。');
    return;
  }
  const { type, pattern } = window._btiResult;
  // 追加情報をbase64エンコードで圧縮して渡す（scoresも含む）
  const extra = {
    position: position,
    age: age,
    salonWork: salonWork,
    scores: scores
  };
  let extraStr = '';
  try {
    extraStr = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(extra)))));
  } catch (e) {
    extraStr = '';
  }
  const liffUrl = `https://liff.line.me/${BTI_LIFF_ID_FOLLOW}?type=${type}&pattern=${pattern}&gender=${gender || 'A'}&x=${extraStr}`;
  window.open(liffUrl, '_blank');
}

// ===== LIFF経由でアクセスされた場合の処理 =====
async function handleShareFromLiff() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('action') !== 'share') return;
  
  console.log('Share action detected, initializing LIFF...');
  
  try {
    // LIFF SDKの読み込み待ち
    if (typeof liff === 'undefined') {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }
    
    // LIFF初期化
    await liff.init({ liffId: BTI_LIFF_ID_SHARE });
    console.log('LIFF initialized');
    
    // ログイン確認
    if (!liff.isLoggedIn()) {
      console.log('Not logged in, redirecting to login...');
      liff.login();
      return;
    }
    
    // プロフィール取得
    const profile = await liff.getProfile();
    const userId = profile.userId;
    console.log('User ID:', userId);
    
    // KVから診断結果取得
    const res = await fetch(`/api/get-result?userId=${userId}`);
    const data = await res.json();
    console.log('Result data:', data);
    
    if (data.success && data.type) {
      const typeData = TYPES[data.type];
      if (typeData) {
        window._btiGender = data.gender || 'A';
        gender = window._btiGender;
        // 自動シェア発火
        setTimeout(() => {
          shareStory(data.type, typeData.name, typeData.catch);
        }, 800);
      } else {
        alert('タイプ情報が取得できませんでした');
      }
    } else {
      alert('診断結果が見つかりませんでした。\n先にBTI診断を受けてください。');
    }
  } catch (e) {
    console.error('Share error:', e);
    alert('シェアに失敗しました: ' + e.message);
  }
}

// ページロード完了後にshare処理を起動
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', handleShareFromLiff);
} else {
  handleShareFromLiff();
}
