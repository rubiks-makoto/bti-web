// ========== ロジック ==========
function getURLParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    type: (params.get('type') || 'CRAFTER').toUpperCase(),
    pattern: parseInt(params.get('pattern') || '1', 10)
  };
}

function renderReport() {
  const { type, pattern } = getURLParams();
  const root = document.getElementById('report-root');
  
  const typeData = REPORT_DATA[type];
  if (!typeData) {
    root.innerHTML = `
      <div class="error">
        <h2>レポートが見つかりませんでした</h2>
        <p>タイプ: ${type}</p>
        <p>正しいURLパラメータでアクセスしてください。</p>
      </div>
    `;
    return;
  }
  
  const patternData = typeData.patterns[pattern];
  if (!patternData) {
    root.innerHTML = `
      <div class="error">
        <h2>パターンが見つかりませんでした</h2>
        <p>タイプ: ${type} / パターン: ${pattern}</p>
      </div>
    `;
    return;
  }
  
  root.innerHTML = `
    <div class="type-card">
      <div class="type-label">YOUR TYPE</div>
      <div class="type-name">${typeData.name}</div>
      <div class="type-eng">${typeData.eng}</div>
      <div class="pattern-badge">パターン ${pattern} ・ ${patternData.title}</div>
    </div>
    
    <div class="report-content">
      ${patternData.body}
    </div>
    
    <div class="cta-section">
      <div class="cta-title">N E X T  S T E P</div>
      <div class="cta-buttons">
        <a href="https://line.me/R/ti/p/@210mmztg" class="cta-btn cta-btn-primary">気軽にキャリア相談する</a>
        <a href="/income.html" class="cta-btn">適正年収を計算する</a>
        <a href="/" class="cta-btn">BTI診断をもう一度</a>
      </div>
    </div>
    
    <footer class="footer">
      B T I  |  美容師タイプ診断
    </footer>
  `;
  
  // タイトルとメタデータを更新
  document.title = `${typeData.name} - BTI 深掘りレポート`;
}

// 実行
renderReport();
