function getURLParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    type: (params.get('type') || 'CRAFTER').toUpperCase(),
    pattern: parseInt(params.get('pattern') || '1', 10)
  };
}

function renderReport() {
  const { type, pattern } = getURLParams();
  const root = document.getElementById('report-root');
  
  const typeData = REPORT_DATA[type];
  if (!typeData) {
    root.innerHTML = `
      <div class="error">
        <h2>レポートが見つかりませんでした</h2>
        <p>タイプ: ${type}</p>
        <p>正しいURLパラメータでアクセスしてください。</p>
      </div>
    `;
    return;
  }
  
  const patternData = typeData.patterns[pattern];
  if (!patternData) {
    root.innerHTML = `
      <div class="error">
        <h2>パターンが見つかりませんでした</h2>
        <p>タイプ: ${type} / パターン: ${pattern}</p>
      </div>
    `;
    return;
