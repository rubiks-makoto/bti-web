<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTI 深掘りレポート</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0a0a0a !important;
    color: #e8d4a8 !important;
    font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    max-width: 400px;
    padding: 40px 24px;
    text-align: center;
  }
  .logo {
    font-size: 11px;
    letter-spacing: 6px;
    color: #d4af37;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 22px;
    font-weight: 400;
    color: #f5e6c8;
    margin-bottom: 32px;
    line-height: 1.6;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid rgba(212, 175, 55, 0.2);
    border-top-color: #d4af37;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    font-size: 15px;
    color: #d4af37;
  }
  .error {
    color: #e57373;
    font-size: 14px;
    line-height: 1.8;
  }
  .btn {
    display: inline-block;
    margin-top: 24px;
    padding: 14px 32px;
    background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%);
    color: #0a0a0a;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">B T I  |  D E E P  R E P O R T</div>
  <h1>深掘りレポートを読み込み中</h1>
  <div id="status-area">
    <div class="spinner"></div>
    <p class="status">あなたの診断結果を取得しています...</p>
  </div>
</div>

<script>
const LIFF_ID = '2010016684-jUp9eANQ';
const statusArea = document.getElementById('status-area');

async function init() {
  try {
    // LIFF内で開かれているか確認
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: window.location.href });
      return;
    }

    const profile = await liff.getProfile();
    const userId = profile.userId;

    // KVから診断結果を取得
    const response = await fetch('/api/get-result?userId=' + userId);
    const result = await response.json();

    if (result.success && result.reportUrl) {
      // レポートページにリダイレクト
      window.location.href = result.reportUrl;
    } else {
      // 診断結果がない場合
      statusArea.innerHTML = '<p class="error">まだ診断を受けていないようです。<br>先にBTI診断を受けてください。</p><a href="https://bti-web.vercel.app/" class="btn">BTI診断を受ける</a>';
    }

  } catch (error) {
    console.error('Error:', error);
    statusArea.innerHTML = '<p class="error">読み込みに失敗しました。<br>もう一度お試しください。</p><a href="https://bti-web.vercel.app/" class="btn">トップに戻る</a>';
  }
}

init();
</script>
</body>
</html>
