<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>BTI | DEEP REPORT</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0705;color:#f8f5ef;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{text-align:center;padding:40px 24px}
.spinner{width:32px;height:32px;border:3px solid rgba(196,150,63,0.2);border-top-color:#c4963f;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.title{font-size:12px;letter-spacing:0.3em;color:rgba(196,150,63,0.7);margin-bottom:16px}
.status{font-size:14px;color:rgba(248,245,239,0.6);line-height:1.8}
.success{color:#c4963f;font-size:16px}
.success-sub{color:rgba(248,245,239,0.5);font-size:13px;margin-top:8px}
.error{color:#e74c3c;font-size:14px}
.btn{display:inline-block;margin-top:16px;padding:12px 24px;background:rgba(196,150,63,0.15);border:1px solid rgba(196,150,63,0.3);color:#c4963f;text-decoration:none;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<div class="container">
<div class="title">B T I | D E E P R E P O R T</div>
<div id="status-area"><div class="spinner"></div><p class="status">読み込み中...</p></div>
</div>
<script>
var params=new URLSearchParams(window.location.search);
var btiType=params.get('type')||'';
var btiPattern=params.get('pattern')||'';
var btiGender=params.get('gender')||'A';
var btiExtra=params.get('x')||'';
var LIFF_ID='2010016684-jUp9eANQ';
var statusArea=document.getElementById('status-area');

function decodeExtra(s){
  if(!s) return {};
  try{
    var json=decodeURIComponent(escape(atob(decodeURIComponent(s))));
    return JSON.parse(json);
  }catch(e){
    console.error('decode error',e);
    return {};
  }
}

async function initLiff(){
try{
await liff.init({liffId:LIFF_ID});
if(!liff.isLoggedIn()){liff.login({redirectUri:window.location.href});return;}
var profile=await liff.getProfile();
var userId=profile.userId;
var displayName=profile.displayName||'';
statusArea.innerHTML='<div class="spinner"></div><p class="status">登録中...</p>';
if(!btiType||!btiPattern){statusArea.innerHTML='<p class="error">診断結果が見つかりません。</p><a href="https://bti-web.vercel.app/" class="btn">BTI診断を受ける</a>';return;}

var extra=decodeExtra(btiExtra);

var payload={
  userId:userId,
  type:btiType,
  pattern:btiPattern,
  gender:btiGender,
  displayName:displayName
};
if(extra.position) payload.position=extra.position;
if(extra.age) payload.age=extra.age;
if(extra.salonWork) payload.salonWork=extra.salonWork;
if(extra.scores) payload.scores=extra.scores;

var response=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
var result=await response.json();
if(result.success){
statusArea.innerHTML='<p class="success">&#10003; 登録完了！</p><p class="success-sub">LINEのトーク画面に戻ります...<br>メニューの「深掘りレポート」をタップしてください</p>';
setTimeout(function(){if(liff.isInClient()){liff.closeWindow();}else{window.location.href='https://line.me/R/ti/p/@210mmztg';}},2000);
}else{statusArea.innerHTML='<p class="error">エラーが発生しました。</p><a href="https://bti-web.vercel.app/" class="btn">トップに戻る</a>';}
}catch(error){console.error('LIFF error:',error);statusArea.innerHTML='<p class="error">エラーが発生しました。</p><a href="https://bti-web.vercel.app/" class="btn">トップに戻る</a>';}
}
initLiff();
</script>
</body>
</html>
