<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTI 深掘りレポート | LINE連携</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0a0a0a !important;
    color: #e8d4a8 !important;
    font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    max-width: 400px;
    padding: 40px 24px;
    text-align: center;
  }
  .logo {
    font-size: 11px;
    letter-spacing: 6px;
    color: #d4af37;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 22px;
    font-weight: 400;
    color: #f5e6c8;
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .sub {
    font-size: 14px;
    color: rgba(232, 212, 168, 0.7);
    margin-bottom: 40px;
    line-height: 1.8;
  }
  .status {
    font-size: 16px;
    color: #d4af37;
    margin-bottom: 16px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid rgba(212, 175, 55, 0.2);
    border-top-color: #d4af37;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    color: #e57373;
    font-size: 14px;
    margin-top: 16px;
  }
  .success {
    color: #81c784;
    font-size: 16px;
    font-weight: 600;
  }
  .success-sub {
    color: rgba(232, 212, 168, 0.7);
    font-size: 13px;
    margin-top: 12px;
    line-height: 1.8;
  }
  .btn {
    display: inline-block;
    margin-top: 24px;
    padding: 14px 32px;
    background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%);
    color: #0a0a0a;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">B T I  |  D E E P  R E P O R T</div>
  <h1>深掘りレポートを<br>受け取る</h1>
  <p class="sub">LINE連携で、あなた専用の<br>深掘りレポートをお届けします</p>
  
  <div id="status-area">
    <div class="spinner"></div>
    <p class="status">LINE連携中...</p>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const btiType = params.get('type') || '';
const btiPattern = params.get('pattern') || '';

const LIFF_ID = '2010016684-jUp9eANQ';

const statusArea = document.getElementById('status-area');

async function initLiff() {
  try {
    await liff.init({ liffId: LIFF_ID });
    
    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: window.location.href });
      return;
    }
    
    const profile = await liff.getProfile();
    const userId = profile.userId;
    
    statusArea.innerHTML = '<div class="spinner"></div><p class="status">レポートを準備中...</p>';
    
    if (!btiType || !btiPattern) {
      statusArea.innerHTML = '<p class="error">診断結果が見つかりませんでした。</p><p class="success-sub">BTI診断を先に受けてから、こちらのページにお戻りください。</p><a href="https://bti-web.vercel.app/" class="btn">BTI診断を受ける</a>';
      return;
    }
    
    const response = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: userId, type: btiType, pattern: btiPattern })
    });
    
    const result = await response.json();
    
    if (result.success) {
      const friendship = await liff.getFriendship();
      
      if (friendship.friendFlag) {
        statusArea.innerHTML = '<p class="success">&#10003; 準備完了！</p><p class="success-sub">LINEにレポートをお送りしました。<br>LINEを確認してください。</p><a href="' + result.reportUrl + '" class="btn">レポートを読む</a>';
        setTimeout(function() { window.location.href = result.reportUrl; }, 3000);
      } else {
        statusArea.innerHTML = '<p class="success">&#10003; 登録完了！</p><p class="success-sub">LINE友だち追加後に、<br>あなた専用のレポートが届きます。</p><a href="' + result.reportUrl + '" class="btn">レポートを先に読む</a>';
      }
    } else {
      statusArea.innerHTML = '<p class="error">エラーが発生しました。<br>もう一度お試しください。</p><a href="https://bti-web.vercel.app/" class="btn">トップに戻る</a>';
    }
    
  } catch (error) {
    console.error('LIFF error:', error);
    statusArea.innerHTML = '<p class="error">エラーが発生しました。</p><p class="success-sub">' + (error.message || 'もう一度お試しください。') + '</p><a href="https://bti-web.vercel.app/" class="btn">トップに戻る</a>';
  }
}

initLiff();
</script>
</body>
</html>
