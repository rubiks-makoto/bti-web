<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>BTI 年収シミュレーター — Pattern C</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0f; --surface:#111118; --surface2:#18181f; --border:#2a2a38;
  --accent:#c8a96e; --blue:#7b9cff; --green:#6ee7b7; --red:#f87171; --warn:#fcd34d;
  --text:#e8e8f0; --muted:#888898;
  --c-s:#c8a96e; --c-g:#7b9cff; --c-f:#6ee7b7;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:16px;}
body{background:var(--bg)!important;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(200,169,110,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(200,169,110,0.03) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none;z-index:0;}

.wrap{max-width:640px;margin:0 auto;padding:36px 16px 80px;position:relative;z-index:1;}

.header{text-align:center;margin-bottom:40px;animation:fadeUp .7s ease both;}
.hlabel{font-size:11px;letter-spacing:4px;color:var(--accent);font-weight:700;margin-bottom:12px;}
.header h1{font-family:'DM Serif Display',serif;font-size:clamp(34px,8vw,52px);
  background:linear-gradient(135deg,#fff 0%,var(--accent) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;margin-bottom:10px;}
.header p{color:var(--muted);font-size:14px;line-height:1.8;}

.sec{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 20px;margin-bottom:20px;animation:fadeUp .7s .1s ease both;}
.sec-title{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:700;margin-bottom:22px;display:flex;align-items:center;gap:10px;}
.sec-title::before{content:'';width:20px;height:1px;background:var(--accent);}

.emp-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px;}
.emp-tab{padding:14px 6px;background:var(--surface2);border:2px solid var(--border);border-radius:12px;color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.emp-tab .tab-en{font-size:9px;letter-spacing:1px;opacity:.6;}
.emp-tab[data-e="seishain"]:hover,.emp-tab[data-e="seishain"].active{border-color:var(--c-s);color:var(--c-s);background:rgba(200,169,110,0.08);}
.emp-tab[data-e="gyomu"]:hover,.emp-tab[data-e="gyomu"].active{border-color:var(--c-g);color:var(--c-g);background:rgba(123,156,255,0.08);}
.emp-tab[data-e="free"]:hover,.emp-tab[data-e="free"].active{border-color:var(--c-f);color:var(--c-f);background:rgba(110,231,183,0.08);}

.inp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.inp-group{display:flex;flex-direction:column;gap:8px;}
.inp-label{font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:700;}
.inp-wrap{position:relative;}
.inp-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px 52px 16px 18px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:24px;font-weight:900;transition:border-color .2s;-moz-appearance:textfield;}
.inp-wrap input::-webkit-outer-spin-button,.inp-wrap input::-webkit-inner-spin-button{-webkit-appearance:none;}
.inp-wrap input:focus{outline:none;border-color:var(--accent);}
.inp-unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none;}

.calc-btn{width:100%;margin-top:20px;padding:18px;background:linear-gradient(135deg,var(--accent),#e8c07a);border:none;border-radius:14px;color:#0a0a0f;font-family:'Zen Kaku Gothic New',sans-serif;font-size:16px;font-weight:900;letter-spacing:2px;cursor:pointer;transition:all .2s;}
.calc-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(200,169,110,0.4);}

/* Result */
.result{display:none;} .result.show{display:block;animation:fadeUp .5s ease both;}

.cur-card{background:linear-gradient(135deg,rgba(200,169,110,0.12),rgba(200,169,110,0.02));border:1px solid rgba(200,169,110,0.35);border-radius:16px;padding:24px 20px;margin-bottom:16px;}
.cur-label{font-size:10px;letter-spacing:3px;color:var(--accent);font-weight:700;margin-bottom:10px;}
.cur-income{font-family:'DM Serif Display',serif;font-size:clamp(40px,10vw,60px);color:var(--accent);line-height:1;margin-bottom:6px;}
.cur-income span{font-size:18px;font-weight:400;}
.cur-sub{font-size:14px;color:var(--muted);}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 12px;text-align:center;}
.stat-label{font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:6px;}
.stat-val{font-size:20px;font-weight:900;line-height:1;}
.stat-sub{font-size:10px;color:var(--muted);margin-top:4px;}

.cmp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
@media(max-width:480px){.cmp-grid{grid-template-columns:1fr;}}
.cmp-card{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:18px 14px;position:relative;}
.cmp-card.is-s{border-color:rgba(200,169,110,0.5);background:rgba(200,169,110,0.04);}
.cmp-card.is-g{border-color:rgba(123,156,255,0.5);background:rgba(123,156,255,0.04);}
.cmp-card.is-f{border-color:rgba(110,231,183,0.5);background:rgba(110,231,183,0.04);}
.cmp-badge{position:absolute;top:-9px;left:12px;font-size:9px;font-weight:900;letter-spacing:1px;padding:3px 8px;border-radius:4px;}
.bdg-s{background:var(--c-s);color:#0a0a0f;} .bdg-g{background:var(--c-g);color:#0a0a0f;} .bdg-f{background:var(--c-f);color:#0a0a0f;}
.cmp-name{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:8px;margin-top:4px;}
.cmp-val{font-size:26px;font-weight:900;line-height:1;margin-bottom:3px;}
.cmp-ann{font-size:11px;color:var(--muted);margin-bottom:10px;}
.cmp-diff{font-size:12px;font-weight:700;margin-bottom:10px;}
.bar-bg{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;transition:width 1s cubic-bezier(.4,0,.2,1);}
.bar-s{background:var(--c-s);} .bar-g{background:var(--c-g);} .bar-f{background:var(--c-f);}

.diff-hl{background:rgba(110,231,183,0.08);border:1px solid rgba(110,231,183,0.25);border-radius:14px;padding:20px;margin-bottom:16px;}
.diff-hl.neutral{background:rgba(200,169,110,0.06);border-color:rgba(200,169,110,0.2);}
.diff-main{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.diff-text{font-size:14px;color:var(--muted);line-height:1.7;} .diff-text strong{color:var(--text);}
.diff-num{font-family:'DM Serif Display',serif;font-size:38px;color:var(--green);white-space:nowrap;}
.diff-num.neutral{color:var(--accent);}
.diff-annual{font-size:12px;color:var(--muted);text-align:right;}

/* Merit & Risk blocks */
.insight-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 20px;margin-bottom:16px;}
.insight-title{font-size:11px;letter-spacing:3px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
.insight-title::before{content:'';width:20px;height:1px;}
.insight-title.merit{color:var(--green);} .insight-title.merit::before{background:var(--green);}
.insight-title.risk{color:var(--red);} .insight-title.risk::before{background:var(--red);}
.insight-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
.insight-row:last-child{border-bottom:none;}
.insight-icon{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:6px;}
.insight-text{font-size:13px;line-height:1.9;color:var(--muted);} .insight-text strong{color:var(--text);}

.comment{background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 14px 14px 0;padding:20px;font-size:14px;line-height:1.9;color:var(--muted);margin-bottom:16px;}
.comment strong{color:var(--text);}

/* CTA block */
.cta-block{background:linear-gradient(135deg,rgba(6,199,85,0.08),rgba(6,199,85,0.02));border:1px solid rgba(6,199,85,0.3);border-radius:16px;padding:32px 20px;margin-bottom:16px;text-align:center;}
.cta-label{font-size:10px;letter-spacing:3px;color:#06c755;font-weight:700;margin-bottom:12px;}
.cta-title{font-family:'DM Serif Display',serif;font-size:clamp(20px,5vw,28px);color:#fff;line-height:1.4;margin-bottom:12px;}
.cta-sub{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:24px;}
.cta-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:18px 48px;background:#06c755;border-radius:14px;color:#fff;font-family:'Zen Kaku Gothic New',sans-serif;font-size:16px;font-weight:900;letter-spacing:2px;text-decoration:none;transition:all .2s;}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(6,199,85,0.4);}
.cta-btn svg{flex-shrink:0;}

.footer{text-align:center;margin-top:32px;padding-top:20px;border-top:1px solid var(--border);}
.footer p{font-size:11px;color:var(--muted);line-height:1.8;opacity:.7;}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <div class="hlabel">Beauty Type Indicator</div>
  <h1>Income Simulator</h1>
  <p>売上と働き方を入力して<br>あなたの収入ポテンシャルを確認しよう</p>
</div>

<div class="sec">
  <div class="sec-title">働き方と売上を入力</div>
  <div class="emp-tabs">
    <button class="emp-tab active" data-e="seishain" onclick="setEmploy(this)">正社員<span class="tab-en">EMPLOYEE</span></button>
    <button class="emp-tab" data-e="gyomu" onclick="setEmploy(this)">業務委託<span class="tab-en">CONTRACT</span></button>
    <button class="emp-tab" data-e="free" onclick="setEmploy(this)">フリーランス<span class="tab-en">FREELANCE</span></button>
  </div>
  <div class="inp-grid">
    <div class="inp-group"><div class="inp-label">指名売上（月）</div><div class="inp-wrap"><input type="number" id="inpShimei" placeholder="0" min="0" inputmode="numeric"><span class="inp-unit">万円</span></div></div>
    <div class="inp-group" id="freeGroup"><div class="inp-label">フリー売上（月）</div><div class="inp-wrap"><input type="number" id="inpFree" placeholder="0" min="0" inputmode="numeric"><span class="inp-unit">万円</span></div></div>
  </div>
  <button class="calc-btn" onclick="calculate()">CALCULATE — 診断する</button>
</div>

<div class="result" id="result">
  <div class="cur-card">
    <div class="cur-label">CURRENT INCOME — 現在の推定月収</div>
    <div class="cur-income" id="curIncome">—</div>
    <div class="cur-sub" id="curSub"></div>
  </div>
  <div class="cmp-grid" id="cmpGrid"></div>
  <div id="diffHl"></div>
  <div class="stats-row" id="statsRow"></div>
  <div class="insight-block" id="meritBlock"><div class="insight-title merit">MERIT — メリット</div><div id="meritRows"></div></div>
  <div class="insight-block" id="riskBlock"><div class="insight-title risk">RISK — リスクと注意点</div><div id="riskRows"></div></div>
  <div class="comment" id="comment"></div>

  <div class="cta-block">
    <div class="cta-inner">
      <div class="cta-label">ご質問・ご相談はお気軽に</div>
      <div class="cta-title">美容師キャリアアドバイザーに<br>無料相談</div>
      <div class="cta-sub">あなたの売上・働き方・将来像に合わせて<br>経験豊富なアドバイザーが一緒に考えます</div>
      <a href="https://lin.ee/XXXXX" class="cta-btn" target="_blank" rel="noopener"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M12 1c6.075 0 11 4.925 11 11s-4.925 11-11 11S1 18.075 1 12 5.925 1 12 1"/></svg>LINEで無料相談</a>
    </div>
  </div>

  <div class="footer"><p>※ 一般的な歩合率をもとにした概算です。実際の報酬は勤務先の歩合設計・福利厚生・経費により異なります。</p></div>
</div>
</div>

<script>
const RATE={
  seishain:{shimei:.35,free:.10,base:25,label:'正社員',cls:'is-s',bar:'bar-s',bdg:'bdg-s',col:'var(--c-s)'},
  gyomu:   {shimei:.50,free:.40,label:'業務委託',cls:'is-g',bar:'bar-g',bdg:'bdg-g',col:'var(--c-g)'},
  free:    {shimei:.65,free:0,  label:'フリーランス',cls:'is-f',bar:'bar-f',bdg:'bdg-f',col:'var(--c-f)'},
};
let employ='seishain';

function setEmploy(btn){
  document.querySelectorAll('.emp-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active'); employ=btn.dataset.e;
  document.getElementById('freeGroup').style.display=employ==='free'?'none':'';
  if(employ==='free') document.getElementById('inpFree').value='';
}
function calcIncome(e,s,f){ const r=RATE[e]; const g=s*r.shimei+f*(r.free||0); return e==='seishain'?Math.max(r.base,g):g; }

function getMerits(bestKey,diff,employ,shimei,free){
  const m=[],total=shimei+free;
  if(bestKey==='gyomu'&&employ!=='gyomu'){
    m.push({col:'var(--c-g)',text:`<strong>業務委託</strong>なら、月収が<strong>+${diff.toFixed(1)}万円</strong>増える可能性。年収で<strong>+${(diff*12).toFixed(0)}万円</strong>の差。`});
    m.push({col:'var(--c-g)',text:'出勤日数・時間を自分で設計できる。<strong>ライフスタイルの自由度</strong>が上がる。'});
    if(shimei>=80) m.push({col:'var(--c-g)',text:`指名${shimei}万は業務委託で<strong>十分に生活できるライン</strong>。`});
  } else if(bestKey==='free'&&employ!=='free'){
    m.push({col:'var(--c-f)',text:`<strong>歩合65%</strong>のフリーランスなら手取りが最大化。月<strong>+${diff.toFixed(1)}万円</strong>の可能性。`});
    m.push({col:'var(--c-f)',text:'場所・時間・メニュー・単価を<strong>すべて自分で決められる</strong>完全な自由。'});
  } else if(bestKey==='seishain'){
    m.push({col:'var(--c-s)',text:'<strong>固定給＋社会保険＋有給</strong>がある正社員が、この売上水準では最も安定。'});
    m.push({col:'var(--c-s)',text:'売上安定までは<strong>経済的な安全網</strong>として強い。'});
  }
  if(total>=100) m.push({col:'var(--accent)',text:`月間売上${total}万は<strong>美容師の上位15%</strong>。どの働き方でも環境を選べる。`});
  return m;
}

function getRisks(bestKey,employ,shimei,free){
  const r=[],total=shimei+free;
  if(bestKey==='gyomu'||bestKey==='free'){
    r.push({col:'var(--red)',text:'業務委託・フリーランスは<strong>社会保険がない</strong>。国保・年金・住民税で<strong>額面の数%は消える</strong>。'});
    r.push({col:'var(--red)',text:'<strong>有給・傷病手当・雇用保険がゼロ</strong>。体調を崩した月は収入が止まる。'});
    r.push({col:'var(--warn)',text:'確定申告が必要。経費で節税できるが<strong>手間はかかる</strong>。'});
    if(total<60) r.push({col:'var(--red)',text:`月間売上${total}万での移行は<strong>生活が厳しくなるリスク</strong>大。最低60万以上が目安。`});
    if(free>shimei&&employ!=='free') r.push({col:'var(--warn)',text:'フリー売上が指名より多い状態。移行すると<strong>フリー客がつかず売上が大幅に下がる</strong>可能性あり。'});
  }
  if(bestKey==='free'){
    r.push({col:'var(--red)',text:'シェアサロンの<strong>席代・材料費は自己負担</strong>。月8〜15万の固定費。'});
    r.push({col:'var(--warn)',text:'集客も自分。<strong>SNS発信や紹介の仕組み</strong>がなければジリ貧に。'});
  }
  if(bestKey==='seishain'&&employ!=='seishain'){
    r.push({col:'var(--warn)',text:'正社員は<strong>歩合率が低い</strong>ため、売上が伸びても手取りに反映されにくい。'});
    r.push({col:'var(--warn)',text:'メニュー・単価の<strong>自由度が制限</strong>される。'});
  }
  return r;
}

function genComment(cur,vals,employ,shimei,free){
  const total=shimei+free;
  if(total===0) return '売上を入力するとシミュレーション結果が表示されます。';
  const bestKey=Object.keys(vals).filter(k=>k!==employ).reduce((a,b)=>vals[a]>vals[b]?a:b);
  const diff=vals[bestKey]-cur; let t='';
  if(diff>10){
    t+=`数字だけ見ると<strong>${RATE[bestKey].label}</strong>で月収が大きく変わります。ただし<strong>社会保険料・税金・経費を差し引くと実際の手取り差は縮まります</strong>。<br><br>`;
    if(total<60) t+=`月間売上${total}万円では移行は<strong>慎重に判断すべき</strong>。まず今の環境で売上安定が先決。`;
    else if(total<100) t+=`月間売上${total}万円は<strong>業務委託で十分やっていける水準</strong>。ただし移行直後は売上が下がることも多いので<strong>3ヶ月分の生活費</strong>を貯めてから。`;
    else t+=`月間売上${total}万円は<strong>どの働き方でも選べるレベル</strong>。歩合率だけでなく<strong>集客力・客層・指名維持</strong>を見ること。`;
  } else if(diff>3){
    t+=`${RATE[bestKey].label}で月収が<strong>${diff.toFixed(1)}万円</strong>増える計算。差額が小さいため<strong>安定性・福利厚生</strong>を含めたトータルで判断を。`;
  } else {
    t+=`現在の働き方が<strong>収入面ではほぼ最適</strong>。年収アップは<strong>売上自体を伸ばす</strong>方が確実。単価改善・リピート率がカギ。`;
  }
  t+=`<br><br><strong>大事なのは「額面の年収」ではなく「手元に残る金額」と「5年後も続けられる環境かどうか」。</strong>そしてもうひとつ、<strong>自分自身の向き不向き</strong>。数字上は最適でも、自分の性格や価値観に合わない働き方は長く続きません。安定を求めるタイプなのか、自由に動きたいタイプなのか — 収入だけでなく<strong>自分に合ったスタイル</strong>を選ぶことが、結局いちばんの近道です。`;
  return t;
}

function calculate(){
  const shimei=parseFloat(document.getElementById('inpShimei').value)||0;
  const free=employ==='free'?0:(parseFloat(document.getElementById('inpFree').value)||0);
  const cur=calcIncome(employ,shimei,free);
  const vals={seishain:calcIncome('seishain',shimei,free),gyomu:calcIncome('gyomu',shimei,free),free:calcIncome('free',shimei,free)};
  const max=Math.max(...Object.values(vals));
  const bestKey=Object.keys(vals).reduce((a,b)=>vals[a]>vals[b]?a:b);
  const diff=vals[bestKey]-cur,annualUp=diff*12,threeYear=annualUp*3;

  document.getElementById('curIncome').innerHTML=`${cur.toFixed(1)}<span> 万円 / 月</span>`;
  document.getElementById('curSub').textContent=`年収換算：約 ${(cur*12).toFixed(0)} 万円`;

  document.getElementById('cmpGrid').innerHTML=Object.entries(vals).map(([k,v])=>{
    const r=RATE[k],isCur=k===employ,isBest=k===bestKey&&!isCur,pct=max>0?v/max*100:0,d=v-cur;
    const dSign=d>=0?'+':'',dColor=d>0?r.col:d<0?'var(--muted)':'var(--text)';
    const badge=isCur?`<div class="cmp-badge ${r.bdg}">現在</div>`:isBest?`<div class="cmp-badge ${r.bdg}">最大</div>`:'';
    const diffTxt=!isCur?`<div class="cmp-diff" style="color:${dColor}">${dSign}${d.toFixed(1)}万 / 月</div>`:'<div class="cmp-diff" style="color:var(--muted)">現在の収入</div>';
    return `<div class="cmp-card ${r.cls}">${badge}<div class="cmp-name">${r.label}</div>
      <div class="cmp-val" style="color:${r.col}">${v.toFixed(1)}<span style="font-size:13px;font-weight:400">万</span></div>
      <div class="cmp-ann">年収 約${(v*12).toFixed(0)}万円</div>${diffTxt}
      <div class="bar-bg"><div class="bar-fill ${r.bar}" style="width:${pct}%"></div></div></div>`;
  }).join('');

  document.getElementById('diffHl').innerHTML=diff>1?
    `<div class="diff-hl"><div class="diff-main"><div><div class="diff-text"><strong>${RATE[bestKey].label}</strong>に切り替えた場合</div><div class="diff-annual" style="margin-top:4px;color:var(--muted)">年収換算 +${annualUp.toFixed(0)}万円</div></div><div class="diff-num">+${diff.toFixed(1)}万</div></div></div>`:
    `<div class="diff-hl neutral"><div class="diff-main"><div class="diff-text">現在の働き方が<strong>収入面で最適</strong></div><div class="diff-num neutral">最適</div></div></div>`;

  document.getElementById('statsRow').innerHTML=`
    <div class="stat-card"><div class="stat-label">最大月収差</div><div class="stat-val" style="color:var(--green)">+${diff.toFixed(1)}万</div><div class="stat-sub">月額</div></div>
    <div class="stat-card"><div class="stat-label">年収換算差</div><div class="stat-val" style="color:var(--blue)">+${annualUp.toFixed(0)}万</div><div class="stat-sub">年間</div></div>
    <div class="stat-card"><div class="stat-label">3年累計差</div><div class="stat-val" style="color:var(--accent)">+${threeYear.toFixed(0)}万</div><div class="stat-sub">3年</div></div>`;

  document.getElementById('meritRows').innerHTML=getMerits(bestKey,diff,employ,shimei,free).map(m=>`<div class="insight-row"><div class="insight-icon" style="background:${m.col}"></div><div class="insight-text">${m.text}</div></div>`).join('');
  document.getElementById('riskRows').innerHTML=getRisks(bestKey,employ,shimei,free).map(r=>`<div class="insight-row"><div class="insight-icon" style="background:${r.col}"></div><div class="insight-text">${r.text}</div></div>`).join('');
  document.getElementById('comment').innerHTML=genComment(cur,vals,employ,shimei,free);

  // ホットリード通知（fire-and-forget）
  sendNotify(employ, shimei, free, diff);

  const res=document.getElementById('result'); res.classList.add('show');
  setTimeout(()=>res.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

// 通知送信（バックグラウンド、エラーは無視）
async function sendNotify(employ, shimei, free, diff){
  try{
    // URLパラメータからuserIdを取得（LIFF経由 or リッチメニュー経由）
    const urlParams = new URLSearchParams(window.location.search);
    let userId = urlParams.get('uid') || '';
    // LIFF経由ならprofileから取れる
    if (!userId && typeof liff !== 'undefined' && liff.isLoggedIn && liff.isLoggedIn()){
      try{
        const profile = await liff.getProfile();
        userId = profile.userId;
      }catch(e){}
    }
    if (!userId) return; // userIdなければ通知できないので終了

    await fetch('/api/notify-income', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        userId,
        employ,
        shimei: parseFloat(shimei) || 0,
        free: parseFloat(free) || 0,
        diff: parseFloat(diff) || 0
      })
    });
  }catch(e){
    console.log('notify skipped:', e);
  }
}
</script>
